<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - Juan José Marco Ortega</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .notfound-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .notfound-code {
      font-size: clamp(5rem, 12vw, 9rem);
      font-weight: 800;
      color: var(--accent-primary);
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 12px;
      text-shadow: 0 0 30px var(--accent-glow);
    }
    .notfound-title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-main);
    }
    .notfound-text {
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 28px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container notfound-wrapper">
    <span class="notfound-code">404</span>
    <h1 class="notfound-title">Página no encontrada</h1>
    <p class="notfound-text">
      La página o recurso que buscas no existe o ha sido movida. Regresa al inicio para conocer mi perfil profesional y proyectos.
    </p>
    <a href="index.html" class="btn btn-primary">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Volver al Inicio
    </a>
  </div>
</body>
</html>
